[rlrs_radio_test]
build_src_filter = -<*> +<rlrs_radio_test.cpp>
build_flags =
    -Iinclude
    -DRADIO_SX128X=1
    -DSX12XX_RX_BUFFER_SIZE=69
lib_deps = bblanchon/ArduinoJson @ 7.4.2
extra_scripts =
    pre:python/build_flags.py
    python/build_env_setup.py

; Temporary bench mode for the two usual Wi-Fi build buttons.
; Disable this file in platformio.ini to restore the original ELRS targets.
[env:Unified_ESP32_2400_TX_via_WIFI]
extends = env_common_esp32
board_config = radiomaster.tx_2400.ranger-nano
build_src_filter = ${rlrs_radio_test.build_src_filter}
build_flags =
    ${env_common_esp32.build_flags}
    ${rlrs_radio_test.build_flags}
    -DTARGET_TX=1
    -include target/Unified_ESP32_TX.h
lib_deps = ${rlrs_radio_test.lib_deps}
extra_scripts = ${rlrs_radio_test.extra_scripts}

[env:Unified_ESP8285_2400_RX_via_WIFI]
extends = env_common_esp82xx
board_config = radiomaster.rx_2400.rp1
build_src_filter = ${rlrs_radio_test.build_src_filter}
build_flags =
    -DPLATFORM_ESP8266=1
    -DVTABLES_IN_FLASH=1
    -DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
    ${rlrs_radio_test.build_flags}
    -DTARGET_RX=1
    -include target/Unified_ESP_RX.h
lib_deps = ${rlrs_radio_test.lib_deps}
extra_scripts = ${rlrs_radio_test.extra_scripts}
